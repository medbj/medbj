# Example HTTP vhost. Replace example.com and the root path before enabling.
# Certbot will add the HTTPS server/certificate and optional HTTP redirect.
# Cloudflare's _headers is not interpreted by Nginx. See docs/DEPLOY.md to
# apply the generated Content-Security-Policy when using this server.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    root /var/www/psychology-blog;
    index index.html;

    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # This is a static site, not a single-page application.
    location / {
        try_files $uri $uri/ =404;
    }

    # Astro fingerprints these assets. HTML is deliberately not cached here.
    location ^~ /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /pagefind/ {
        expires 1h;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
